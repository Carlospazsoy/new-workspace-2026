<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random Password Generator</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <div class="password-container">
      <h2>Random Password Generator</h2>

      <div class="input-container">
        <input
          type="text"
          class="input"
          id="input"
          placeholder="Create Password"
          readonly
        />
        <i class="fa-regular fa-copy fa-2x"></i>
      </div>
      <input class="input-test" type="text">
       <p class="parrafo-test">parrafo de prueba del DOM</p>
      <button class="btn">Generate</button>
    </div>
  
     
    
    <div class="alert-container disable ">Password copied</div>
    <script src="index.js"></script>
  </body>
</html>
